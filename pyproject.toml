[project]
name = "torch-rheed"
version = "0.1.0"
description = "Standalone PyTorch package for simulating RHEED rocking curves from bulk.txt and surf.txt inputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "matplotlib>=3.10.7",
  "numpy>=2.3.4",
  "torch>=2.12.0",
]

[project.scripts]
torch-rheed = "torch_rheed.cli:main"

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
